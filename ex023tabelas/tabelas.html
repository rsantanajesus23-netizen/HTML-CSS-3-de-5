<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }
        table{
            width: 400px;
            height: 400px;
            border-collapse: collapse;
        }
        tr.dado{
            background-color:rgb(0, 255, 13);
        }
        td.linha{
            background-color: red;
        }
        td{
            border: 1px solid black;
            padding: 8px;
            vertical-align: text-top;
        }
    </style>
</head>
<body>
    <h1>Minha peimeira tabela</h1>
    <!-- HIERARQUI DE TABELAS (simples)
         TABLE =tabela 
         TABLE ROW = linha de tabela
         TABLE HEADER = cabeçalho de tabela
         TABLE TADA = dado de tabela 
     -->
    <table>
        <tr><!--Primeira linha-->
            <td>A1</td>
            <td>B1</td>
            <td>C1</td>
        </tr>
        <tr class="dado">
            <td>A2</td>
            <td class="linha">B2</td>
            <td>C2</td>
        </tr>
        <tr>
           <td>A3</td>
           <td>B3</td> 
           <td>C3</td> 
        </tr>
        <tr><td>A4</td>
            <td>B4</td>
            <td>C4</td>
        </tr>
        
    </table>
</body>
</html>
