<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste de Imagem de Fundo</title>
    <style>
        body{
            background-image: url('ex022/imagens/wallpaper002.jpg');
        }
        div.quadrado{
            border: 1px solid #140a0a;
            border-radius: 10px;
            background-color: lightgray;
            width: 210px;
            height: 210px;
            display: inline-block;
        }
        div#q1{
            background-color: rgb(48, 116, 116);
        }
        div#q2{
            background-image:linear-gradient(to bottom,#fcdb04e4, #cd620b,#b80404) ;
        }
        div#q3{
            background-image: url("ex022/imagens/wallpaper001.jpg");
        }
    </style>
</head>
<body>
    <div class="quadrado" id="q1">
        <h1>1</h1>
    </div>
    <div class="quadrado" id="q2">
        <h1>2</h1>
    </div>
    <div class="quadrado" id="q3">
        <h1>3   </h1>       
    </div>
</body>
</html>
